- type: entity
  parent: BaseItem
  id: NWTentStandardFolded
  name: folded field tent
  description: A folded canvas tent. Activate in hand with clear ground to the north
    to deploy. Packing takes ten seconds.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _NW/Tents/folded_tents.rsi
    layers:
    - state: base_tent
  - type: NWTentKit
    tent: NWTentStandard
    footprint: -1.5,-2.5,0.5,1.5
  - type: ContainerContainer
    containers:
      nw-packed-tent: !type:Container {}
