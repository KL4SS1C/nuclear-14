- type: entity
  abstract: true
  parent: BaseStructure
  id: NWTentBase
  name: field tent
  description: A canvas field shelter. Entrance faces south. Furnishings are supplied
    separately.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Sprite
    sprite: _NW/Tents/deployed_tents.rsi
    offset: 1,0
    drawdepth: Overdoors
    layers:
    - state: standard_frame
    - state: standard_canvas
      color: '#ddcbc9'
    - state: standard_roof
      map:
      - standard_roof
      color: '#ddcbc9'
  - type: InteractionTransparency
  - type: NWTent
    roofLayers:
    - standard_roof
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -1.5,-2.5,-1.4,1.0
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable
      fix-2:
        shape: !type:PhysShapeAabb
          bounds: 0.4,-2.5,0.5,1.0
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable
      fix-3:
        shape: !type:PhysShapeAabb
          bounds: -1.5,0.4,0.5,1.5
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable
  - type: CollisionWake
    enabled: false
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Physics
    bodyType: Static
    canCollide: true
    fixedRotation: true
  - type: ContainerContainer
    containers:
      nw-tent-kit: !type:Container {}
