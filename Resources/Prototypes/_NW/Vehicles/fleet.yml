- type: entity
  id: NWvehicleHumveeEnclave
  parent: NWvehicleHumvee
  name: Enclave Humvee
  components:
  - type: Sprite
    sprite: _NW/Vehicles/enclave_humvee.rsi
    layers:
    - state: humvee_base
    - state: wheels_0
      map: [nw-humvee-wheels]
    - state: humveehatch_0
    - state: overlight_off
      map:
      - nw-overlights
  - type: NWGroundVehicle
    wreckPrototype: NWvehicleHumveeEnclaveWreck
  - type: NWVehicleCabin
    interiorPath: /Maps/_NW/Vehicles/enclave_humvee.yml
- type: entity
  id: NWvehicleHumveeEnclaveWreck
  parent: NWvehicleHumveeWreck
  name: wrecked Enclave Humvee chassis
  components:
  - type: Sprite
    sprite: _NW/Vehicles/enclave_humvee.rsi
    drawdepth: Objects
    noRot: false
    layers:
    - state: humvee_base
    - state: wheels_1
    - state: damaged_frame
