# RMC furniture adapted to Nuclear-14. See LICENSES/ATTRIBUTION.md.
- type: entity
  parent: BaseStructure
  id: NWBed
  name: bed
  suffix: NW
  description: A mattress seated on a rectangular metallic frame. This is used to
    support a lying person in a comfortable manner, notably for regular sleep. Ancient
    technology, but still useful.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _NW/Structures/Furniture/bed.rsi
    state: bed
    noRot: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.45,-0.45,0.45,0.05
        density: 190
        mask:
        - TableMask
  - type: Strap
    position: Down
    rotation: -90
  - type: PlaceableSurface
    placeCentered: true
  - type: Anchorable
  - type: Pullable
- type: entity
  parent: NWBed
  id: NWBedAlt
  components:
  - type: Sprite
    sprite: _NW/Structures/Furniture/bed.rsi
    state: abed
  suffix: NW, Alternate
  name: bed
- type: entity
  parent: NWBed
