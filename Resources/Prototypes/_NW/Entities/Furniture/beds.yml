# Inherit the installed Nuclear-14 bedroll behavior; override appearance only.
- type: entity
  parent: N14Bedroll
  id: NWBedroll
  name: sleeping bag
  suffix: NW
  description: A portable sleeping bag for resting on the road.
  components:
  - type: Sprite
    sprite: _NW/Structures/Furniture/bedroll.rsi
    noRot: true
    layers:
    - state: bedroll
      map: ["unfoldedLayer"]
    - state: bedroll_folded
      map: ["foldedLayer"]
      visible: false
    - state: bedroll_pillow
      map: ["buckledLayer"]
      visible: false

- type: entity
  parent: NWBedroll
  id: NWBedrollFolded
  suffix: NW, Folded
  components:
  - type: Foldable
    folded: true
