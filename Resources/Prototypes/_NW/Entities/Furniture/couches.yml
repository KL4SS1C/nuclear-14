# RMC furniture adapted to Nuclear-14. See LICENSES/ATTRIBUTION.md.
- type: entity
  parent: SeatBase
  id: NWCouchMid
  name: couch
  description: An upholstered modular couch.
  suffix: Mid, Double
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _NW/Structures/Furniture/Couches/couch.rsi
    state: couch_mid
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts:
        - Destruction
- type: entity
  parent: NWCouchMid
  id: NWCouchEnd
  suffix: End, Double
  components:
  - type: Sprite
    state: couch_end
