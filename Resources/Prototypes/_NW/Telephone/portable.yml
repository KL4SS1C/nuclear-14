- type: entity
  id: NWIntercom
  parent: NWRotaryPhoneWallmount
  name: wall intercom telephone
  description: A wall terminal with a handset linked to its configured telephone network.
- type: entity
  id: NWRotaryPhoneEnclave
  parent: NWRotaryPhone
  name: Enclave telephone
  components:
  - type: NWRotaryPhone
    networkId: enclave
    allowNetworkChanges: false
    category: Facilities
- type: entity
