- type: entity
  id: NWActionPhoneBackpack
  name: Use field telephone
  description: Open the directory, answer an incoming call, or hang up your handset.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    useDelay: 0.5
    icon:
      sprite: _NW/Telephone/Objects/phone.rsi
      state: rpb_phone
    event: !type:NWPhoneBackpackActionEvent {}
