- type: entity
  id: NWPhoneBackpack
  parent: ClothingBackpack
  name: field telephone backpack
  description: A portable telephone with a private network directory. Wear it on your
    back and use the telephone action.
  components:
  - type: Sprite
    sprite: _NW/Telephone/Portable/radio_pack.rsi
    layers:
    - state: icon
      map:
      - base
    - state: closed
  - type: Clothing
    sprite: _NW/Telephone/Portable/radio_pack.rsi
    quickEquip: false
    slots:
    - back
  - type: NWRotaryPhone
    category: Field units
    networkId: public
    allowNetworkChanges: true
    phoneCanBeTransferred: false
  - type: NWPhoneBackpack
  - type: Storage
    grid:
    - 0,0,4,2
  - type: UserInterface
    interfaces:
      enum.NWTelephoneUiKey.Key:
        type: NWTelephoneBui
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NWRotaryPhoneLayers.Layer:
        base:
          Base:
            state: icon
          Ring:
            state: ring
          Ear:
            state: ear
