# Frame and push button are layers of one interactive entity.
- type: entity
  id: NWTransitElevatorButtonGrey
  parent: NWTransitTerminalBase
  name: elevator call button
  suffix: grey
  description: Press to select a destination.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    layers:
    - sprite: Structures/Wallmounts/switch_frame.rsi
      state: grey
    - sprite: Structures/Wallmounts/switch.rsi
      state: dead
